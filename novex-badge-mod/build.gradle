plugins {
    id "fabric-loom" version "1.8.13"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

def badgeSvg = file("../packages/oneclient_app/icons/OneClient.icon/Assets/novex-mark.svg")
def badgePng = file("src/main/resources/assets/novex_badges/textures/novex_badge.png")

tasks.register("extractNovexBadge") {
    inputs.file(badgeSvg)
    outputs.file(badgePng)
    doLast {
        if (!badgeSvg.isFile()) {
            throw new GradleException("NOVEX source emblem is missing: ${badgeSvg}")
        }
        def svg = badgeSvg.getText("UTF-8")
        def matcher = (svg =~ /data:image\/png;base64,([^"]+)/)
        if (!matcher.find()) {
            throw new GradleException("NOVEX source emblem does not contain its embedded PNG")
        }
        badgePng.parentFile.mkdirs()
        badgePng.bytes = java.util.Base64.decoder.decode(matcher.group(1))
    }
}

tasks.configureEach {
    if (name == "sourcesJar") {
        dependsOn(tasks.named("extractNovexBadge"))
    }
}

processResources {
    dependsOn tasks.named("extractNovexBadge")
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version, "loader_version": project.loader_version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
