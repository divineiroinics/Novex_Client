plugins {
    id "net.fabricmc.fabric-loom-remap" version "1.19-SNAPSHOT" apply false
    id "net.fabricmc.fabric-loom" version "1.19-SNAPSHOT" apply false
}

def modernMinecraft = project.minecraft_version.startsWith("26.")
if (modernMinecraft) {
    apply plugin: "net.fabricmc.fabric-loom"
} else {
    apply plugin: "net.fabricmc.fabric-loom-remap"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.mapping_mode == "yarn") {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    } else {
        // The non-remapping Loom plugin uses ordinary Gradle configurations.
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    }
}

if (modernMinecraft) {
    sourceSets.main.java.srcDir("src/modern/java")
    sourceSets.main.java.exclude("org/xirx/novexbadge/BadgeText.java")
    sourceSets.main.java.exclude("org/xirx/novexbadge/mixin/**")
}

def badgeSvg = file("../packages/oneclient_app/icons/OneClient.icon/Assets/novex-mark.svg")
def badgePng = file("src/main/resources/assets/novex_badges/textures/novex_badge.png")

tasks.register("extractNovexBadge") {
    inputs.file(badgeSvg)
    outputs.file(badgePng)
    doLast {
        if (!badgeSvg.isFile()) {
            throw new GradleException("NOVEX source emblem is missing: ${badgeSvg}")
        }
        def svg = badgeSvg.getText("UTF-8")
        def matcher = (svg =~ /data:image\/png;base64,([^"]+)/)
        if (!matcher.find()) {
            throw new GradleException("NOVEX source emblem does not contain its embedded PNG")
        }
        badgePng.parentFile.mkdirs()
        badgePng.bytes = java.util.Base64.decoder.decode(matcher.group(1))
    }
}

tasks.configureEach {
    if (name == "sourcesJar") {
        dependsOn(tasks.named("extractNovexBadge"))
    }
}

processResources {
    dependsOn tasks.named("extractNovexBadge")
    inputs.property "version", project.version
    def mixinProperties = [
        "mixin_package": project.mixin_package,
        "entity_mixin": project.entity_mixin,
        "player_list_mixin": project.player_list_mixin,
        "mixin_compatibility": project.mixin_compatibility
    ]
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "java_release": project.java_release
    }
    filesMatching("novex_badges.client.mixins.json") {
        expand mixinProperties
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_release.toString())
}
