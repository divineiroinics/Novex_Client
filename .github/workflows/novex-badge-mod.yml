name: NOVEX Badge Mod

on:
  push:
    branches: [novex/rebrand]
    paths:
      - "novex-badge-mod/**"
      - "packages/oneclient_core/build.rs"
      - "packages/oneclient_core/src/lib.rs"
      - "packages/oneclient_core/src/game/launch.rs"
      - "packages/oneclient_app/icons/OneClient.icon/Assets/novex-mark.svg"
      - "scripts/build-novex-badge-mods.py"
      - ".github/workflows/novex-badge-mod.yml"
  pull_request:
    paths:
      - "novex-badge-mod/**"
      - "packages/oneclient_core/build.rs"
      - "packages/oneclient_core/src/lib.rs"
      - "packages/oneclient_core/src/game/launch.rs"
      - "packages/oneclient_app/icons/OneClient.icon/Assets/novex-mark.svg"
      - "scripts/build-novex-badge-mods.py"
      - ".github/workflows/novex-badge-mod.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build every Fabric version in the NOVEX catalog
        run: python3 scripts/build-novex-badge-mods.py
      - name: Upload all badge mod variants
        uses: actions/upload-artifact@v4
        with:
          name: NOVEX-Badges-Fabric-All-Catalog-Versions
          path: |
            packages/oneclient_core/novex-badges-*.jar
            packages/oneclient_core/novex-badge-versions.txt
          if-no-files-found: error
