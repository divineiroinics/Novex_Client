name: NOVEX Badge Mod

on:
  push:
    branches: [novex/rebrand]
    paths:
      - "novex-badge-mod/**"
      - "packages/oneclient_app/icons/OneClient.icon/Assets/novex-mark.svg"
      - ".github/workflows/novex-badge-mod.yml"
  pull_request:
    paths:
      - "novex-badge-mod/**"
      - "packages/oneclient_app/icons/OneClient.icon/Assets/novex-mark.svg"
      - ".github/workflows/novex-badge-mod.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft_version: "1.21.1"
            yarn_mappings: "1.21.1+build.3"
            loader_version: "0.16.10"
            fabric_api_version: "0.116.18+1.21.1"
          - minecraft_version: "1.21.4"
            yarn_mappings: "1.21.4+build.8"
            loader_version: "0.16.10"
            fabric_api_version: "0.119.4+1.21.4"
          - minecraft_version: "1.21.5"
            yarn_mappings: "1.21.5+build.1"
            loader_version: "0.16.14"
            fabric_api_version: "0.128.2+1.21.5"
          - minecraft_version: "1.21.8"
            yarn_mappings: "1.21.8+build.1"
            loader_version: "0.17.3"
            fabric_api_version: "0.136.1+1.21.8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build Fabric mod
        working-directory: novex-badge-mod
        run: >-
          gradle --no-daemon clean build
          -Pminecraft_version=${{ matrix.minecraft_version }}
          -Pyarn_mappings=${{ matrix.yarn_mappings }}
          -Ploader_version=${{ matrix.loader_version }}
          -Pfabric_api_version=${{ matrix.fabric_api_version }}
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: NOVEX-Badges-Fabric-${{ matrix.minecraft_version }}
          path: |
            novex-badge-mod/build/libs/*.jar
            !novex-badge-mod/build/libs/*-sources.jar
          if-no-files-found: error
