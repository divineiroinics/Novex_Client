name: NOVEX Client Release Build

on:
  # Approved upstream-sync PRs and other changesets merged to main publish a
  # signed NOVEX release automatically. Keep manual dispatch for recovery.
  push:
    branches: [main]
    paths:
      - ".changeset/*.md"
  workflow_dispatch:

# NOTE: CARGO_PACKAGER_SIGN_PRIVATE_KEY* are deliberately NOT declared at
# workflow level. Swatinem/rust-cache folds every `CARGO*`-prefixed environment
# variable into its cache key, so a workflow-level declaration gave this workflow
# a cache namespace that the nightly workflow could never populate - every
# release built the whole dependency graph from scratch. They are scoped to the
# individual steps that actually need them instead.

concurrency:
  group: oneclient-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Knope finds the commit (and so the PR author) that added each change file
          fetch-depth: 0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          restore-cache: false

      # Validate signing before consuming changesets, bumping the version, or
      # creating a draft release. A bad secret must not leave a half-release.
      - name: Verify NOVEX updater signing key pair
        shell: bash
        env:
          NOVEX_UPDATER_PUBKEY: ${{ vars.NOVEX_UPDATER_PUBKEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_PACKAGER_SIGN_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing CARGO_PACKAGER_SIGN_PRIVATE_KEY repository secret."
            exit 1
          fi
          if [ -z "${NOVEX_UPDATER_PUBKEY:-}" ]; then
            echo "::error::Missing NOVEX_UPDATER_PUBKEY repository variable."
            exit 1
          fi
          cargo run --quiet --manifest-path scripts/verify-novex-updater-keypair/Cargo.toml

      - name: Install Knope
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: knope
          version: 0.23.0

      - name: Consume changesets
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          read_version() {
            sed -n -E '/^\[workspace\.package\]/,/^\[/ s/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1
          }

          # No change files means a re-run of a release whose version commit
          # already landed, so carry on with the current version.
          RELEASED=0
          if compgen -G ".changeset/*.md" > /dev/null; then
            knope prepare-release
            cargo update --workspace --offline || cargo update --workspace
            RELEASED=1
          fi

          VERSION="$(read_version)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from [workspace.package] in Cargo.toml"
            exit 1
          fi
          TAG="novex-$VERSION"
          echo "Releasing NOVEX Client $VERSION"

          # Abort rather than clobber: a published release (or an existing tag,
          # which only appears once a release is published) means this version
          # already shipped. A *draft* is a previous failed/partial run of this
          # same workflow, so reuse it.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin - NOVEX Client $VERSION has already been released. Add a change file with \`knope document-change\` first."
            exit 1
          fi

          RELEASE_EXISTS=0
          IS_DRAFT=""
          if IS_DRAFT="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)"; then
            RELEASE_EXISTS=1
          fi
          if [ "$RELEASE_EXISTS" = "1" ] && [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release $TAG already exists and is published - refusing to overwrite NOVEX Client $VERSION. Add a change file with \`knope document-change\` first."
            exit 1
          fi

          # Commit only after the guards pass, so a rejected release does not
          # leave a stray version bump on the branch.
          if [ "$RELEASED" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A Cargo.toml Cargo.lock .changeset CHANGELOG.md
            git commit -m "chore: release $VERSION"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          SHA="$(git rev-parse HEAD)"

          if [ "$RELEASE_EXISTS" = "1" ]; then
            echo "Reusing existing draft release $TAG"
            gh release edit "$TAG" --target "$SHA"
          else
            # The body is what the launcher's changelog page shows
            awk -v heading="## $VERSION " '/^## /{p = index($0, heading) == 1; next} p' \
              CHANGELOG.md > notes.md 2>/dev/null || true
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "::error::No changelog entry for $VERSION. Add a change file with \`knope document-change\` first."
              exit 1
            fi
            gh release create "$TAG" \
              --draft \
              --target "$SHA" \
              --title "NOVEX Client $VERSION" \
              --notes-file notes.md
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  package:
    needs: prepare
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
            os_key: windows
            arch: x86_64
            formats: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      # Pin to the commit `prepare` resolved - after a release that is the version
      # commit it just pushed, which github.sha would not point at.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Apply NOVEX branding to every UI string and app icon
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/apply-novex-branding.py

      - name: Build the bundled NOVEX badge mod
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Build and stage every catalog Fabric badge mod
        shell: bash
        run: python3 scripts/build-novex-badge-mods.py

      - name: Install cargo-packager
        if: matrix.os_key == 'linux'
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Build release binary
        shell: bash
        env:
          NOVEX_UPDATER_PUBKEY: ${{ vars.NOVEX_UPDATER_PUBKEY }}
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --bin oneclient_app --target ${{ matrix.target }}
          else
            cargo build --release --bin oneclient_app
          fi

      - name: (Windows) Verify badge jars are embedded in the launcher
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          binary = Path("target/release/oneclient_app.exe").read_bytes()
          jars = sorted(Path("packages/oneclient_core").glob("novex-badges-*.jar"))
          if not jars:
              raise SystemExit("No NOVEX Fabric badge jars were staged")
          for jar_path in jars:
              jar = jar_path.read_bytes()
              if not jar or jar not in binary:
                  raise SystemExit(f"{jar_path.name} is missing from the launcher binary")
              version = jar_path.name.removeprefix("novex-badges-").removesuffix(".jar")
              print(f"embedded badge jar verified: Minecraft {version} ({len(jar)} bytes)")
          print(f"Verified {len(jars)} embedded Fabric badge variants")
          PY

      - name: (Windows) Stage app-local VC++ runtime
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: python3 distribution/windows/bundle-crt.py

      - name: (Windows) Verify staged runtime is Microsoft-signed
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem 'target/crt/*.dll')
          if ($dlls.Count -eq 0) { Write-Error 'no CRT DLLs staged'; exit 1 }
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            Write-Host "$($dll.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Error "$($dll.Name) signature is $($sig.Status), refusing to ship it"
              exit 1
            }
            if ($sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              Write-Error "$($dll.Name) is not signed by Microsoft"
              exit 1
            }
          }

      - name: Package
        shell: bash
        if: matrix.os_key == 'linux'
        env:
          CI: true
          NOVEX_UPDATER_PUBKEY: ${{ vars.NOVEX_UPDATER_PUBKEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: cargo packager --release --formats ${{ matrix.formats }} --verbose

      - name: Resolve packager output dir
        id: outdir
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            echo "dir=target/${{ matrix.target }}/release" >> "$GITHUB_OUTPUT"
          else
            echo "dir=target/release" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload debug symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          OUT_DIR: ${{ steps.outdir.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "Sentry credentials not configured (need SENTRY_AUTH_TOKEN secret + SENTRY_ORG/SENTRY_PROJECT vars); skipping debug-symbol upload."
            exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | bash
          export PATH="/usr/local/bin:$PATH"
          SYMS="$(mktemp -d)"
          shopt -s nullglob
          for f in "$OUT_DIR"/oneclient_app "$OUT_DIR"/oneclient_app.exe \
                   "$OUT_DIR"/oneclient_app.pdb "$OUT_DIR"/*.dwp "$OUT_DIR"/*.dSYM; do
            [ -e "$f" ] || continue
            cp -R "$f" "$SYMS/"
          done
          sentry-cli debug-files upload --include-sources "$SYMS"

      - name: Upload installers and build manifest fragment
        if: matrix.os_key == 'linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          OUT_DIR: ${{ steps.outdir.outputs.dir }}
          OS_KEY: ${{ matrix.os_key }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash .github/scripts/upload-release-assets.sh

      - name: Upload manifest fragment
        if: matrix.os_key == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-${{ matrix.os_key }}-${{ matrix.arch }}
          path: fragments/*.json
          overwrite: true

  # ---------------------------------------------------------------------------
  windows-sign:
    needs: [prepare, package]
    runs-on: windows-latest
    permissions:
      contents: write
      # Required so SignPath can download the uploaded build artifacts.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Find unsigned app binary artifact
        id: win_unsigned_bin
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=oneclient-windows-binary-unsigned" --jq '.artifacts[0].id')"
          [ -n "$id" ] || { echo "::error::oneclient-windows-binary-unsigned artifact not found"; exit 1; }
          echo "artifact-id=$id" >> "$GITHUB_OUTPUT"

      - name: (Windows) Submit SignPath signing request for app binary
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: onelauncher
          signing-policy-slug: release-signing
          artifact-configuration-slug: onelauncher-binary
          github-artifact-id: ${{ steps.win_unsigned_bin.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-bin

      - name: (Windows) Swap in signed app binary
        shell: bash
        run: |
          set -euo pipefail
          signed="signed-bin/oneclient_app.exe"
          if [ ! -e "$signed" ]; then
            echo "::error::SignPath did not return signed-bin/oneclient_app.exe"
            ls -R signed-bin || true
            exit 1
          fi
          mkdir -p target/release
          cp "$signed" target/release/oneclient_app.exe

      - name: (Windows) Verify app binary is signed
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature 'target/release/oneclient_app.exe'
          Write-Host "Authenticode status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -eq 'NotSigned') {
            Write-Error 'oneclient_app.exe carries no Authenticode signature'
            exit 1
          }

      - name: (Windows) Stage app-local VC++ runtime
        shell: bash
        run: python3 distribution/windows/bundle-crt.py

      - name: (Windows) Verify staged runtime is Microsoft-signed
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem 'target/crt/*.dll')
          if ($dlls.Count -eq 0) { Write-Error 'no CRT DLLs staged'; exit 1 }
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            Write-Host "$($dll.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Error "$($dll.Name) signature is $($sig.Status), refusing to ship it"
              exit 1
            }
            if ($sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              Write-Error "$($dll.Name) is not signed by Microsoft"
              exit 1
            }
          }

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Package
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
          CI: 'true'
        run: cargo packager --release --formats nsis --verbose

      - name: (Windows) Locate installer
        id: win_installer
        shell: bash
        run: echo "path=$(ls target/release/*-setup.exe | head -n1)" >> "$GITHUB_OUTPUT"

      - name: (Windows) Smoke-test installer layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\oneclient-smoke'
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          $exe = Resolve-Path '${{ steps.win_installer.outputs.path }}'
          # NSIS: /S is silent, /D= sets the install dir and must be the last arg.
          $p = Start-Process -FilePath $exe -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exited $($p.ExitCode)"; exit 1 }

          Write-Host '--- installed layout ---'
          Get-ChildItem -Recurse $dest | ForEach-Object { Write-Host $_.FullName }

          if (-not (Test-Path "$dest\oneclient_app.exe")) {
            Write-Error "oneclient_app.exe is not at the root of $dest"
            exit 1
          }
          foreach ($dll in @(Get-ChildItem 'target/crt/*.dll')) {
            if (-not (Test-Path (Join-Path $dest $dll.Name))) {
              Write-Error "$($dll.Name) did not land beside oneclient_app.exe - cargo-packager put resources elsewhere, so app-local CRT loading will not work"
              exit 1
            }
          }
          Write-Host "OK: $($(Get-ChildItem 'target/crt/*.dll').Count) CRT DLLs sit beside oneclient_app.exe"

      - name: Upload installers and build manifest fragment
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          OUT_DIR: target/${{ matrix.target }}/release
          OS_KEY: darwin
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Identify the single updater artifact for this platform (the file with a
          # sibling .sig): -setup.exe (nsis), *.app.tar.gz (app), *.AppImage (appimage).
          # NOTE: nullglob is on, so an unmatched glob expands to nothing. Use arrays
          # rather than `ls <glob> | head` - the latter falls back to listing the cwd
          # when nothing matches, silently picking an unrelated file.
          fmt=""; ext=""; matches=()
          case "$OS_KEY" in
            windows) matches=("$OUT_DIR"/*-setup.exe); fmt="nsis"; ext="exe" ;;
            darwin)  matches=("$OUT_DIR"/*.app.tar.gz); fmt="app"; ext="app.tar.gz" ;;
            linux)   matches=("$OUT_DIR"/*.AppImage); fmt="appimage"; ext="AppImage" ;;
          esac
          updater_file="${matches[0]:-}"
          if [ -z "$updater_file" ]; then
            echo "::error::No updater artifact found in $OUT_DIR for $OS_KEY"
            exit 1
          fi

          # The updater bundle isn't always arch-tagged by cargo-packager, so the two
          # macOS legs would collide on the release. Rename the updater artifact + its .sig
          # to an arch-unique name before upload, and point the manifest at that name.
          unique="NOVEX_Client_${VERSION}_${OS_KEY}_${ARCH}.${ext}"
          cp "$updater_file" "$OUT_DIR/$unique"
          cp "$updater_file.sig" "$OUT_DIR/$unique.sig"

          # cargo-packager names the .deb after the binary (oneclient_app_<ver>_amd64.deb).
          # Rename it to the same OneClient_<ver>_<os>_<arch> scheme as the other assets so
          # the AUR oneclient-bin package can point at a stable, predictable URL.
          deb_unique=""
          deb_matches=("$OUT_DIR"/*.deb)
          if [ -e "${deb_matches[0]:-}" ]; then
            deb_unique="NOVEX_Client_${VERSION}_${OS_KEY}_${ARCH}.deb"
            cp "${deb_matches[0]}" "$OUT_DIR/$deb_unique"
          fi

          # Same treatment for the .rpm (cargo-generate-rpm names it
          # oneclient_app-<ver>-1.x86_64.rpm).
          rpm_unique=""
          rpm_matches=("$OUT_DIR"/*.rpm)
          if [ -e "${rpm_matches[0]:-}" ]; then
            rpm_unique="NOVEX_Client_${VERSION}_${OS_KEY}_${ARCH}.rpm"
            cp "${rpm_matches[0]}" "$OUT_DIR/$rpm_unique"
          fi

          # Upload only NOVEX-named installers and the renamed signed updater bundle.
          # Do not publish cargo-packager's raw *-setup.exe (it retains the upstream
          # oneclient_app filename); the NOVEX-named copy above is the user-facing installer.
          for f in "$OUT_DIR"/*.dmg ${deb_unique:+"$OUT_DIR/$deb_unique"} ${rpm_unique:+"$OUT_DIR/$rpm_unique"} "$OUT_DIR"/*.AppImage "$OUT_DIR/$unique" "$OUT_DIR/$unique.sig"; do
            [ -e "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done

          base="$unique"
          mkdir -p fragments
          case "$OS_KEY" in
            darwin) KEYS="darwin-${ARCH} macos-${ARCH}" ;;
            *)      KEYS="${OS_KEY}-${ARCH}" ;;
          esac
          SIG="$(cat "$updater_file.sig")" \
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${base}" \
          FMT="$fmt" \
          KEYS="$KEYS" \
          FRAG_NAME="${OS_KEY}-${ARCH}" \
          python3 - <<'PY'
          import json, os
          entry = {
            "signature": os.environ["SIG"],
            "url": os.environ["URL"],
            "format": os.environ["FMT"],
          }
          frag = {key: entry for key in os.environ["KEYS"].split()}
          with open(f"fragments/{os.environ['FRAG_NAME']}.json", "w") as f:
              json.dump(frag, f)
          PY

      - name: Upload manifest fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-darwin-${{ matrix.arch }}
          path: fragments/*.json
          overwrite: true

  manifest:
    needs: [prepare, package, windows-sign, macos-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all manifest fragments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: manifest-*
          path: fragments
          merge-multiple: true

      - name: Assemble latest.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, glob, os, datetime
          platforms = {}
          for path in glob.glob("fragments/*.json"):
              with open(path) as f:
                  platforms.update(json.load(f))
          manifest = {
              "version": os.environ["VERSION"],
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Validate Windows update manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("latest.json").read_text())
          assert manifest.get("version") == os.environ["VERSION"], "manifest version does not match release"
          platforms = manifest.get("platforms", {})
          assert set(platforms) == {"windows-x86_64"}, f"unexpected platform entries: {sorted(platforms)}"
          entry = platforms["windows-x86_64"]
          assert entry.get("format") == "nsis", "Windows updater format must be nsis"
          assert entry.get("signature"), "Windows update signature is missing"
          prefix = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/"
          assert entry.get("url", "").startswith(prefix), "Windows update URL does not point to this release"
          print("Validated Windows updater manifest")
          PY

      - name: Upload manifest and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          release_id="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -f make_latest=true
