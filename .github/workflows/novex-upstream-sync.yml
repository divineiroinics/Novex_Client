name: NOVEX upstream sync # canonical-logo-validation-and-updater-key
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [novex/rebrand]
    paths:
      - .github/workflows/novex-upstream-sync.yml
permissions:
  contents: write
concurrency:
  group: novex-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: novex/rebrand
          fetch-depth: 0
      - name: Merge latest OneLauncher upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NOVEX Sync Bot"
          git config user.email "novex-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/Polyfrost/OneLauncher.git
          git fetch upstream main
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            # Never silently retain stale NOVEX-side code on an upstream conflict.
            if ! git merge --no-edit --no-ff upstream/main; then
              git merge --abort || true
              echo "::error::Upstream changes conflict with NOVEX customizations. Resolve the conflict on novex/rebrand, then rerun this workflow."
              exit 1
            fi
          fi
      - name: Reapply canonical NOVEX branding
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/apply-novex-branding.py
      - name: Format upstream Rust changes
        run: cargo fmt --all
      - name: Validate branding and workspace metadata
        run: |
          set -euo pipefail
          test -s branding/novex-mark.png
          test -s packages/oneclient_app/icons/icon.ico
          test -s packages/oneclient_app/icons/icon.icns
          test -s packages/oneclient_app/icons/OneClient.icon/Assets/oneclient-mark.svg
          grep -q 'product-name = "NOVEX Client"' packages/oneclient_app/Cargo.toml
          grep -q 'publisher = "XIRX"' packages/oneclient_app/Cargo.toml
          grep -q 'UPDATER_ENDPOINT' packages/oneclient_app/src/constants.rs
          grep -q 'UPDATER_PUBKEY' packages/oneclient_app/src/constants.rs
          test "$(grep -c '^pub const UPDATER_ENDPOINT:' packages/oneclient_app/src/constants.rs)" -eq 1
          test "$(grep -c '^pub const UPDATER_PUBKEY:' packages/oneclient_app/src/constants.rs)" -eq 1
          grep -q 'option_env!("NOVEX_UPDATER_PUBKEY")' packages/oneclient_app/src/constants.rs
          ! grep -q 'UPDATER_PUBKEY: &str = "option_env!' packages/oneclient_app/src/constants.rs
          grep -q 'ProductName", "NOVEX Client"' packages/oneclient_app/build.rs
          grep -q 'NOVEX Client v' packages/oneclient_common/src/constants.rs
          grep -q 'UPDATER_ENDPOINT' packages/oneclient_app/src/constants.rs
          grep -q 'UPDATER_PUBKEY' packages/oneclient_app/src/constants.rs
      - name: Commit branding overlay and push verified upstream sync
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin novex/rebrand
            if ! git merge-base --is-ancestor origin/novex/rebrand HEAD; then
              if ! git merge --no-edit origin/novex/rebrand; then
                git merge --abort || true
                echo "::error::The NOVEX branch moved with conflicting changes during sync. Retry after reviewing the branch."
                exit 1
              fi
              python scripts/apply-novex-branding.py
              cargo fmt --all
              grep -q 'product-name = "NOVEX Client"' packages/oneclient_app/Cargo.toml
              grep -q 'publisher = "XIRX"' packages/oneclient_app/Cargo.toml
              grep -q 'UPDATER_ENDPOINT' packages/oneclient_app/src/constants.rs
              grep -q 'UPDATER_PUBKEY' packages/oneclient_app/src/constants.rs
              grep -q 'ProductName", "NOVEX Client"' packages/oneclient_app/build.rs
            fi
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: reapply NOVEX branding after upstream sync"
            fi
            if git push origin HEAD:refs/heads/novex/rebrand; then
              exit 0
            fi
            echo "Branch moved during push attempt $attempt; retrying against the latest branch."
          done
          echo "::error::Could not push the upstream sync after three retries."
          exit 1
