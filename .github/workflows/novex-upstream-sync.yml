name: NOVEX upstream sync
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [novex/rebrand]
    paths: [.github/workflows/novex-upstream-sync.yml]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: novex-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: novex/rebrand
          fetch-depth: 0
      - name: Configure sync commit identity
        run: |
          git config user.name "NOVEX Upstream Sync"
          git config user.email "41898282+novex-sync@users.noreply.github.com"
      - name: Merge latest OneLauncher upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Polyfrost/OneLauncher.git
          git fetch upstream main
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            if ! git merge --no-edit --no-ff upstream/main; then
              git merge --abort || true
              echo "::error::Upstream conflicts need a manual resolution."
              exit 1
            fi
          fi
      - name: Reapply canonical NOVEX branding
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/apply-novex-branding.py
      - name: Validate branding and formatting
        run: |
          test -s branding/novex-mark.webp
          test -s packages/oneclient_app/icons/icon.ico
          test -s packages/oneclient_app/icons/icon.icns
          grep -q "NOVEX Client" packages/oneclient_app/lang/en_us.json
          grep -q "XIRX" packages/oneclient_app/Cargo.toml
          cargo fmt --all -- --check
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: novex/rebrand
          branch: novex/upstream-sync
          delete-branch: true
          title: "Sync latest OneLauncher updates into NOVEX"
          body: "Automated upstream sync. NOVEX branding is reapplied after merging upstream; review checks before merging."
          commit-message: "chore: sync OneLauncher upstream and reapply NOVEX branding"
