name: NOVEX upstream sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/novex-upstream-sync.yml

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: novex-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NOVEX
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and merge latest OneLauncher
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NOVEX Sync Bot"
          git config user.email "novex-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/Polyfrost/OneLauncher.git
          git fetch upstream main
          before_sync="$(git rev-parse HEAD)"
          conflict_files=""
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            # First try a normal merge. For overlapping edits, create a
            # candidate merge with NOVEX-priority hunks, then restore each
            # conflicted file in full from NOVEX. This keeps the proposal
            # buildable while importing upstream changes everywhere else.
            # The PR reports every deferred file and is never auto-merged.
            if ! git merge --no-edit --no-ff upstream/main; then
              conflict_files="$(git diff --name-only --diff-filter=U || true)"
              git merge --abort || true
              if ! git merge --no-edit --no-ff -X ours upstream/main; then
                git merge --abort || true
                echo "::error::The upstream merge could not be resolved safely, even with NOVEX-priority conflict hunks."
                exit 1
              fi
              if [ -n "$conflict_files" ]; then
                # Preserve NOVEX's complete versions of source files with
                # overlapping edits. Merge shared metadata files deliberately:
                # upstream dependency additions, NOVEX package identity, and
                # new English translation keys all survive.
                while IFS= read -r path; do
                  [ -n "$path" ] || continue
                  case "$path" in
                    Cargo.toml|Cargo.lock|packages/oneclient_app/lang/en_us.json)
                      ;;
                    *)
                      git checkout "$before_sync" -- "$path"
                      git add "$path"
                      ;;
                  esac
                done <<< "$conflict_files"

                # Keep NOVEX's complete CI/workflow directory. Explicitly
                # remove upstream-added workflow files as well as resetting
                # existing ones; checkout alone does not remove paths absent
                # from the NOVEX tree.
                new_workflows="$(git diff --name-only --diff-filter=A "$before_sync" HEAD -- .github/workflows)"
                if [ -n "$new_workflows" ]; then
                  while IFS= read -r path; do
                    [ -n "$path" ] || continue
                    git rm -f -- "$path"
                  done <<< "$new_workflows"
                fi
                git checkout "$before_sync" -- .github/workflows novex-badge-mod
                git add -A .github/workflows novex-badge-mod
                if [ -n "$(git diff --cached --name-only "$before_sync" -- .github/workflows novex-badge-mod)" ]; then
                  echo "::error::The upstream proposal still changes NOVEX workflow files."
                  exit 1
                fi

                python - "$before_sync" <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          base = sys.argv[1]

          def show(ref, path):
              return subprocess.check_output(["git", "show", f"{ref}:{path}"], text=True)

          # Start with upstream dependency/profile updates, but keep NOVEX's
          # repository links and independent release version.
          path = "Cargo.toml"
          novex_manifest = show(base, path)
          upstream_manifest = show("upstream/main", path)
          section_pattern = re.compile(r"(?ms)^\[workspace\.package\]\n(.*?)(?=^\[|\Z)")
          novex_section = section_pattern.search(novex_manifest).group(1)
          upstream_match = section_pattern.search(upstream_manifest)
          upstream_section = upstream_match.group(1)
          for key in ("documentation", "homepage", "repository", "version"):
              value = re.search(rf'(?m)^{key}\s*=\s*"([^"]*)"', novex_section).group(1)
              upstream_section = re.sub(
                  rf'(?m)^{key}\s*=\s*"[^"]*"',
                  f'{key} = "{value}"',
                  upstream_section,
                  count=1,
              )
          start, end = upstream_match.span(1)
          Path(path).write_text(upstream_manifest[:start] + upstream_section + upstream_manifest[end:])

          # Regenerate the lockfile from the merged dependency manifest.
          Path("Cargo.lock").write_text(show("upstream/main", "Cargo.lock"))

          # Keep existing NOVEX translations, but import new upstream keys.
          path = "packages/oneclient_app/lang/en_us.json"
          novex_json = json.loads(show(base, path))
          upstream_json = json.loads(show("upstream/main", path))

          def merge_missing(target, source):
              for key, value in source.items():
                  if key not in target:
                      target[key] = value
                  elif isinstance(target[key], dict) and isinstance(value, dict):
                      merge_missing(target[key], value)

          merge_missing(novex_json, upstream_json)
          Path(path).write_text(json.dumps(novex_json, ensure_ascii=False, indent=2) + "\n")
          PY
                git add Cargo.toml Cargo.lock packages/oneclient_app/lang/en_us.json
                if ! git diff --cached --quiet; then
                  git commit -m "chore: merge upstream dependencies and translations with NOVEX metadata"
                fi
              fi
            fi
            if [ "$(git rev-parse HEAD)" != "$before_sync" ]; then
              mkdir -p .changeset
              upstream_sha="$(git rev-parse upstream/main)"
              changeset=".changeset/novex-upstream-${upstream_sha:0:12}.md"
              cat > "$changeset" <<'EOF'
          ---
          default: patch
          ---

          # Sync the latest OneLauncher changes

          Import the reviewed upstream OneLauncher update while preserving NOVEX branding and updater identity.
          EOF
            fi
          else
            echo "NOVEX already contains the latest OneLauncher main commit."
          fi

          {
            echo "conflicts<<NOVEX_CONFLICTS"
            if [ -n "$conflict_files" ]; then
              printf '%s\n' "$conflict_files"
            else
              echo "None"
            fi
            echo "NOVEX_CONFLICTS"
          } >> "$GITHUB_OUTPUT"

      - name: Reapply NOVEX branding and updater identity
        id: branding
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/apply-novex-branding.py

      - name: Format and validate
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo update --workspace
          test -s branding/novex-mark.png
          test -s packages/oneclient_app/icons/icon.ico
          test -s packages/oneclient_app/icons/icon.icns
          test -s packages/oneclient_app/icons/OneClient.icon/Assets/novex-mark.svg
          grep -q 'product-name = "NOVEX Client"' packages/oneclient_app/Cargo.toml
          grep -q 'identifier = "org.xirx.NOVEXClient"' packages/oneclient_app/Cargo.toml
          grep -q 'publisher = "XIRX"' packages/oneclient_app/Cargo.toml
          grep -q 'UPDATER_ENDPOINT' packages/oneclient_app/src/constants.rs
          grep -q 'UPDATER_PUBKEY' packages/oneclient_app/src/constants.rs
          test "$(grep -c '^pub const UPDATER_ENDPOINT:' packages/oneclient_app/src/constants.rs)" -eq 1
          test "$(grep -c '^pub const UPDATER_PUBKEY:' packages/oneclient_app/src/constants.rs)" -eq 1
          grep -q 'option_env!("NOVEX_UPDATER_PUBKEY")' packages/oneclient_app/src/constants.rs
          grep -q 'ProductName", "NOVEX Client"' packages/oneclient_app/build.rs
          grep -q 'NOVEX Client v' packages/oneclient_common/src/constants.rs
          cargo metadata --no-deps --format-version 1 > /tmp/novex-cargo-metadata.json

      - name: Create upstream update pull request
        id: upstream_pr
        uses: peter-evans/create-pull-request@v7
        continue-on-error: true
        with:
          token: ${{ secrets.NOVEX_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          base: main
          branch: novex/upstream-sync-proposal
          delete-branch: false
          title: "Sync latest OneLauncher updates into NOVEX"
          body: |
            Automated upstream sync proposal.

            - Imports the latest Polyfrost/OneLauncher main changes.
            - Reapplies the canonical NOVEX branding, package identity, icons, and updater endpoint/key configuration.
            - Non-conflicting upstream files are imported.
            - Conflicting source files are retained from NOVEX for safety; their upstream changes are deferred for manual merging.
            - The root manifest imports upstream dependencies while retaining NOVEX repository identity/version, and English translations merge missing upstream keys.
            - NOVEX GitHub workflows and the tested NOVEX badge-mod Gradle project are retained; upstream workflow definitions and incompatible badge build configuration are excluded.
            - This PR is not auto-merged and must pass Windows build validation before merging.

            Files that had overlapping edits:
            ${{ steps.merge.outputs.conflicts }}

            The installed NOVEX application is not updated by this workflow directly. This workflow proposes source changes against main; a successful signed NOVEX release is still required to distribute them.
          commit-message: "chore: sync OneLauncher upstream and reapply NOVEX branding"
          author: "NOVEX Sync Bot <novex-sync-bot@users.noreply.github.com>"
          committer: "NOVEX Sync Bot <novex-sync-bot@users.noreply.github.com>"

      - name: Explain manual proposal fallback
        if: steps.upstream_pr.outcome == 'failure'
        run: |
          echo "::warning::The upstream sync branch was prepared, but GitHub blocked automatic PR creation. Enable 'Allow GitHub Actions to create and approve pull requests' or configure NOVEX_SYNC_TOKEN to restore automatic proposal creation."

      # PR checks can be approval-gated for a newly created proposal branch.
      # workflow_dispatch is an allowed GITHUB_TOKEN-triggered event, so run
      # the Windows validation explicitly whenever the proposal branch exists.
      - name: Dispatch Windows validation for the upstream proposal
        if: always() && steps.merge.outcome == 'success' && steps.branding.outcome == 'success' && steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/novex/upstream-sync-proposal >/dev/null 2>&1; then
            gh workflow run novex-proposal-validation.yml --repo "$GITHUB_REPOSITORY" --ref novex/upstream-sync-proposal
          else
            echo "::warning::The proposal branch was not pushed; Windows validation cannot be dispatched."
          fi
