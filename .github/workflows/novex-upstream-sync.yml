name: NOVEX upstream sync
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: novex-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NOVEX rebrand branch
        uses: actions/checkout@v4
        with:
          ref: novex/rebrand
          fetch-depth: 0
      - name: Merge latest OneLauncher upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Polyfrost/OneLauncher.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "NOVEX is already up to date with OneLauncher."
          else
            git merge --no-edit --no-ff upstream/main || {
              git merge --abort
              echo "::error::Upstream changes conflict with NOVEX customizations. Resolve the conflict before syncing."
              exit 1
            }
          fi
      - name: Reapply canonical NOVEX branding
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/apply-novex-branding.py
      - name: Validate branded assets and metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s branding/novex-mark.png
          test -s packages/oneclient_app/icons/icon.ico
          test -s packages/oneclient_app/assets/logo.svg
          grep -q "NOVEX Client" packages/oneclient_app/lang/en_us.json
          grep -q "XIRX" packages/oneclient_app/Cargo.toml
          cargo fmt --all -- --check
      - name: Open or update upstream sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: novex/rebrand
          branch: novex/upstream-sync
          delete-branch: true
          title: "Sync latest OneLauncher updates into NOVEX"
          body: |
            Automated upstream sync from Polyfrost/OneLauncher.

            The NOVEX branding overlay is reapplied after the merge. Review CI and resolve any upstream compatibility changes before merging.
          commit-message: "chore: sync OneLauncher upstream and reapply NOVEX branding"
