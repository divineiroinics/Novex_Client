name: NOVEX upstream sync
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [novex/rebrand]
    paths:
      - .github/workflows/novex-upstream-sync.yml
permissions:
  contents: write
concurrency:
  group: novex-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: novex/rebrand
          fetch-depth: 0
      - name: Merge latest OneLauncher upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NOVEX Sync Bot"
          git config user.email "novex-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/Polyfrost/OneLauncher.git
          git fetch upstream main
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            git merge --no-edit --no-ff -X ours upstream/main
          fi
      - name: Reapply canonical NOVEX branding
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/apply-novex-branding.py
      - name: Validate branding and workspace metadata
        run: |
          set -euo pipefail
          test -s branding/novex-mark.webp
          test -s packages/oneclient_app/icons/icon.ico
          test -s packages/oneclient_app/icons/icon.icns
          grep -q 'product-name = "NOVEX Client"' packages/oneclient_app/Cargo.toml
          grep -q 'publisher = "XIRX"' packages/oneclient_app/Cargo.toml
          grep -q "NOVEX Client" packages/oneclient_app/lang/en_us.json
          cargo metadata --no-deps --format-version 1 > /tmp/novex-cargo-metadata.json
      - name: Commit branding overlay and push the verified upstream sync
        shell: bash
        run: |
          set -euo pipefail
          git add packages/oneclient_app/assets/logo.svg packages/oneclient_app/assets/icons/icon-logo.svg packages/oneclient_app/assets/icons/pixel/icon-logo.svg packages/oneclient_app/icons packages/oneclient_app/lang/en_us.json packages/oneclient_app/Cargo.toml
          if ! git diff --cached --quiet; then
            git commit -m "chore: reapply NOVEX branding after upstream sync"
          fi
          git push origin HEAD:refs/heads/novex/rebrand
