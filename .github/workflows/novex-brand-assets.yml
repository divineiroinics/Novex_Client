name: NOVEX branded assets
on:
  push:
    branches:
      - novex/rebrand
    paths:
      - branding/novex-mark.webp
      - scripts/apply-novex-branding.py
      - .github/workflows/novex-brand-assets.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: novex-brand-assets
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: novex/rebrand
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate every supported app icon size
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/apply-novex-branding.py
      - name: Commit generated NOVEX assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/oneclient_app/assets/logo.svg packages/oneclient_app/assets/icons/icon-logo.svg packages/oneclient_app/assets/icons/pixel/icon-logo.svg packages/oneclient_app/icons
          if git diff --cached --quiet; then
            echo "Brand assets already match the canonical emblem."
            exit 0
          fi
          git commit -m "chore: regenerate NOVEX branded app icons"
          git push origin HEAD:novex/rebrand
